name: Update Catalogs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Update catalogs or compare fetching without publishing
        type: choice
        options: [update, compare]
        default: update
      transport:
        description: Transport for catalog updates
        type: choice
        options: [http, browser]
        default: http
      regions:
        description: Optional comma-separated region slugs (comparison defaults to three sample regions)
        type: string
      force:
        description: Refresh selected regions even if their chart date is current
        type: boolean
        default: false
      comparison_order:
        description: Reverse on a subsequent comparison to check order effects
        type: choice
        options: [http-first, browser-first]
        default: http-first
  schedule:
    - cron: "30 15,17,19 * * *"

permissions:
  contents: write

concurrency:
  group: update-catalogs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
      FLIXPATROL_SOLVE_CF: "1"
      FLIXPATROL_SOLVE_HEADED: "1"
      FLIXPATROL_PROXY: ${{ secrets.FLIXPATROL_PROXY }}
      RUN_MODE: ${{ inputs.mode || 'update' }}
      FLIXPATROL_TRANSPORT: ${{ inputs.transport || 'http' }}
      INPUT_REGIONS: ${{ inputs.regions }}
      INPUT_FORCE: ${{ inputs.force }}
      COMPARISON_ORDER: ${{ inputs.comparison_order || 'http-first' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install scraper
        run: python -m pip install ".[solver]"

      - name: Install solver browser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          scrapling install --force

      - name: Restore region checkpoints
        if: env.RUN_MODE == 'update'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .catalog-state
          key: catalog-progress-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-progress-v1-${{ runner.os }}-

      - name: Validate TMDB credentials
        if: env.RUN_MODE == 'update'
        run: |
          if [ -z "${TMDB_API_KEY}" ] && [ -z "${TMDB_ACCESS_TOKEN}" ]; then
            echo "TMDB_API_KEY or TMDB_ACCESS_TOKEN must be configured as a repository or environment secret."
            exit 1
          fi

      - name: Update slim catalogs
        timeout-minutes: 30
        if: env.RUN_MODE == 'update'
        run: |
          args=()
          if [ -n "$INPUT_REGIONS" ]; then args+=(--region "$INPUT_REGIONS"); fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          xvfb-run -a python scripts/update_catalogs.py "${args[@]}"

      - name: Compare fetching transports
        if: env.RUN_MODE == 'compare'
        run: |
          args=(--order "$COMPARISON_ORDER")
          if [ -n "$INPUT_REGIONS" ]; then args+=(--region "$INPUT_REGIONS"); fi
          xvfb-run -a python scripts/compare_fetching.py "${args[@]}"

      - name: Save region checkpoints
        if: always() && env.RUN_MODE == 'update'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .catalog-state
          key: catalog-progress-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize freshness
        id: freshness
        if: always() && env.RUN_MODE == 'update'
        run: python scripts/report_update.py

      - name: Commit and push catalog updates
        if: success() && env.RUN_MODE == 'update' && steps.freshness.outputs.published == 'true'
        run: |
          if [ -z "$(git status --porcelain -- catalogs)" ]; then
            echo "No catalog changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'catalogs/*.json'
          git commit -m "chore: update FP catalogs"
          git push

      - name: Upload update or comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: exports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Require current catalogs
        if: success() && env.RUN_MODE == 'update' && steps.freshness.outputs.pending != '0'
        run: |
          echo "Valid region updates were published; remaining regions need recovery. See the freshness report."
          exit 1
